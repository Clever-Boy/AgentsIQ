agents:
  - name: researcher
    role: Finds relevant information
    model: openai:gpt-4o-mini
    allowed_tools: ["retrieval"]

  - name: analyst
    role: Summarizes and explains findings
    model: anthropic:claude-3-haiku
    allowed_tools: ["summarize"]

settings:
  logging:
    format: "json"
    level: "info"
  router:
    strategy: "hybrid"
